backend:
  name: git-gateway
  branch: main # أو master حسب اسم الـ Branch عندك في جيت هب

# مكان حفظ الصور التي يتم رفعها من لوحة التحكم
media_folder: "image"
public_folder: "image"

collections:
  - name: "content"
    label: "إدارة الموقع"
    files:
      - name: "siteData"
        label: "الأخبار والمنتجات"
        file: "data.json"
        fields:
          - label: "قائمة الأخبار"
            name: "news"
            widget: "list"
            fields:
              - {label: "معرف الخبر (رقم فريد)", name: "id", widget: "number"}
              - {label: "عنوان الخبر", name: "title", widget: "string"}
              - {label: "صورة الخبر", name: "img", widget: "image"}
              - {label: "مقتطف الخبر (الظاهر في الكارت)", name: "excerpt", widget: "text"}
              - {label: "تفاصيل الخبر الكاملة", name: "desc", widget: "text"}

          - label: "قائمة المنتجات"
            name: "products"
            widget: "list"
            fields:
              - {label: "رقم المنتج", name: "id", widget: "number"}
              - {label: "اسم المنتج", name: "title", widget: "string"}
              - {label: "السعر", name: "price", widget: "string"}
              - {label: "صورة المنتج", name: "img", widget: "image"}
              - {label: "وصف المنتج", name: "description", widget: "string"}
              - {label: "شارة المنتج (مثال: طبيعي 100%)", name: "badge", widget: "string", required: false}
              - {label: "متوفر للبيع؟", name: "isLive", widget: "boolean"}
